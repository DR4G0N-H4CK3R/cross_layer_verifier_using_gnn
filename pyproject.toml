[project]
name = "gwverify"
version = "0.3.0"
description = "Cross-layer verification of an untrusted IoT gateway with an independent 802.15.4 radio witness"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
capture = ["scapy>=2.5"]
eval = ["scikit-learn>=1.3", "matplotlib>=3.7"]
dashboard = ["fastapi>=0.110", "uvicorn>=0.29"]
mqtt = ["paho-mqtt>=1.6"]
torch = ["torch>=2.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
